server {
    listen 80;
    server_name _;

    # Cho phép upload tài liệu lớn qua nginx
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy mọi /api/* tới backend (cùng network Docker)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # Preserve the browser-visible port so OAuth callbacks generated by
        # FastAPI exactly match the public origin (for example :8080).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI generate có thể chậm + stream -> tắt buffer, tăng timeout
        # Verification gọi nhiều API tuần tự → cần timeout dài hơn
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check backend (tuỳ chọn)
    location = /api/health {
        proxy_pass http://backend:8000/health;
    }

    # Missing hashed assets must fail as files instead of returning SPA HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate the entry point so rebuilds do not keep referring to old assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for document navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
